<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="260" viewBox="0 0 1200 260"
     role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">How TagTeam works</title>
  <desc id="wf-desc">Four steps: ground the call objective from a photo or description, optionally research the office, practice with the avatar, then review a cheat sheet.</desc>

  <rect width="1200" height="260" rx="24" fill="#f2e8cf"/>

  <text x="56" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#386641">From a letter to a confident call</text>

  <g id="steps" transform="translate(56 92)">
    <!-- 1. Ground -->
    <g transform="translate(0 0)">
      <rect width="230" height="108" rx="16" fill="#fbf7ea" stroke="#d8d3be" stroke-width="1.5"/>
      <text x="18" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1" fill="#6b7a63">01 · GROUND</text>
      <text x="18" y="62" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21" fill="#1f2a1f">Photo or describe</text>
      <text x="18" y="92" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" fill="#6b7a63">What are you calling about?</text>
    </g>

    <path d="M248 54 l14 0 m-6 -8 l8 8 l-8 8" stroke="#a7c957" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 2. Research -->
    <g transform="translate(286 0)">
      <rect width="230" height="108" rx="16" fill="#fbf7ea" stroke="#d8d3be" stroke-width="1.5"/>
      <text x="18" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1" fill="#6b7a63">02 · RESEARCH</text>
      <text x="18" y="62" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21" fill="#1f2a1f">Look up the office</text>
      <text x="18" y="92" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" fill="#6b7a63">Real procedures, grounded</text>
    </g>

    <path d="M534 54 l14 0 m-6 -8 l8 8 l-8 8" stroke="#a7c957" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 3. Practice -->
    <g transform="translate(572 0)">
      <rect width="230" height="108" rx="16" fill="#fbf7ea" stroke="#d8d3be" stroke-width="1.5"/>
      <text x="18" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1" fill="#6b7a63">03 · PRACTICE</text>
      <text x="18" y="62" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21" fill="#1f2a1f">Call the avatar</text>
      <text x="18" y="92" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" fill="#6b7a63">Live vocab + hold help</text>
    </g>

    <path d="M820 54 l14 0 m-6 -8 l8 8 l-8 8" stroke="#a7c957" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 4. Review -->
    <g transform="translate(858 0)">
      <rect width="230" height="108" rx="16" fill="#386641"/>
      <text x="18" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1" fill="#f2e8cf">04 · REVIEW</text>
      <text x="18" y="62" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21" fill="#f2e8cf">Take the cheat sheet</text>
      <text x="18" y="92" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" fill="#e7e3d0">If-then phrases, ready</text>
    </g>
  </g>
</svg>
