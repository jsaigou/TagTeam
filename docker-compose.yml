# TagTeam — one `docker compose up`. The DB persists on the ./data volume.
# Copy .env.example to .env and fill in the values (env_file injects them).
services:
  tagteam:
    build: .
    image: tagteam:latest
    restart: unless-stopped
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      # SQLite lives on the mounted volume so it survives container rebuilds.
      DATABASE_PATH: /app/data/tagteam.db
    volumes:
      - ./data:/app/data
